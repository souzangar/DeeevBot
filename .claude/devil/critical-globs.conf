# .claude/devil/critical-globs.conf — div-report's critical-path scope.
#
# One glob per line, matched (shell `case` pattern) against repo-relative
# changed-file paths. Blank lines and lines starting with # are ignored.
# This file is DATA — read and matched by .claude/scripts/devil.sh (effort
# escalation + invariant injection) and .claude/hooks/critical-path-tripwire.sh
# (authoring-time tripwire); never executed. Comments go on their own lines:
# both consumers read every other line, whole, as a glob.
#
# The module map and the rules each module carries are
# doc/architecture/adr-0006-data-model-and-module-layout.md; the rule texts
# are .claude/devil/critical-invariants.md. src/errors/, src/i18n/ and
# src/platforms/ are deliberately not critical.
#
# Coverage is pinned by selftest/critical-globs-completeness.sh: every file
# under src/ or migrations/ that carries the `@critical-path` anchor comment
# (`// @critical-path` in TypeScript, `-- @critical-path` in SQL) must match
# a glob below.

# Bot wiring, handlers, rendering with previews disabled, the webhook
# secret check: rules 2 and 4.
*src/telegram/*
# The allowlist gate and the membership check: rules 2 and 4.
*src/auth/*
# The report state machine, routing table, approval records, grace and
# cancel: rules 1, 3 and 7.
*src/review/*
# The broadcast engine, ledger, pacing, retraction, closure, budget:
# rules 1 and 5.
*src/broadcast/*
# HMAC references, log redaction, the retention job: rules 6 and 8.
*src/privacy/*
# The zod schema and loaders: rules 2 and 6.
*src/config/*
# The SqlDb port and its adapters: rule 8.
*src/db/*
# The D1 schema migrations (wrangler's migrations_dir): rule 8.
*migrations/*
# The Worker entry (HTTP, cron, the broadcaster Durable Object).
*src/worker.ts
# The Node port's entry (long polling), when it lands.
*src/node.ts
